name: Release Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.5.6)"
        required: true
        type: string
      signing_mode:
        description: "Windows signing mode"
        required: false
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - pfx
          - signpath
          - ossign

# Serialize release builds on main so auto version bumps never race each other
concurrency:
  group: release-windows-main
  cancel-in-progress: false

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  WINDOWS_SIGNING_MODE: ${{ github.event.inputs.signing_mode || vars.WINDOWS_SIGNING_MODE || 'unsigned' }}

jobs:
  skip-non-main:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip reason
        run: |
          echo "Release build is restricted to main branch. Current ref is ${{ github.ref_name }}. Skipping build."

  release-windows:
    if: github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 生成发布说明需要完整提交历史与历史 tag（默认浅克隆取不到上一个 tag）
          fetch-depth: 0

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            # auto mode: bump patch by 1; carry into minor when patch exceeds 9 (2.0.9 -> 2.1.0)
            $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $current = if ($conf.package -and $conf.package.version) { $conf.package.version } else { $conf.version }
            if ($current -notmatch '^\d+\.\d+\.\d+$') { throw "unexpected version in tauri.conf.json: $current" }
            $parts = $current.Split('.')
            $patch = [int]$parts[2] + 1
            if ($patch -gt 9) {
              $patch = 0
              $parts[1] = "$([int]$parts[1] + 1)"
            }
            $version = "$($parts[0]).$($parts[1]).$patch"
            Write-Host "[INFO] auto bump version: $current -> $version"
          } else {
            # manual mode: version comes from the release_tag input
            $tag = "${{ github.event.inputs.release_tag }}".Trim()
            if (-not $tag) { throw "release_tag input is required for manual runs" }
            if (-not $tag.StartsWith("v")) { throw "release_tag must start with v, got: $tag" }
            $version = $tag.Substring(1)
            if (-not $version) { throw "resolved VERSION is empty from tag: $tag" }
          }
          "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: "false"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Generate release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $noteArgs = @(
            "scripts/release/release-notes.mjs",
            "--version", $env:VERSION,
            "--out", "artifacts/staging/notes.md"
          )
          # 手动重发已存在的 tag 时以该 tag 为终点，避免混入其后的提交
          if (git tag -l $env:TAG_NAME) { $noteArgs += @("--to", $env:TAG_NAME) }
          # 自动发版同时写 UPDATELOG.md，随下面的版本提交一起进仓库
          if ("${{ github.event_name }}" -eq "push") { $noteArgs += "--write-updatelog" }
          node @noteArgs

      - name: Bump version, commit and tag (auto mode)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $text = Get-Content package.json -Raw
          $rx = [regex]'("version"\s*:\s*)"[^"]*"'
          $newText = $rx.Replace($text, ('$1"' + $env:VERSION + '"'), 1)
          Set-Content -Path package.json -Value $newText -NoNewline -Encoding UTF8
          pnpm sync-metadata

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).package.version
          if ($pkgVersion -ne $env:VERSION -or $tauriVersion -ne $env:VERSION) {
            throw "version sync failed: package=$pkgVersion tauri=$tauriVersion expected=$env:VERSION"
          }

          $lockPath = "src-tauri/Cargo.lock"
          $lines = Get-Content $lockPath
          $inTarget = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[\[package\]\]') { $inTarget = $false; continue }
            if ($lines[$i] -match '^name = "clash-astra"') { $inTarget = $true; continue }
            if ($inTarget -and $lines[$i] -match '^\s*version\s*=') {
              $lines[$i] = 'version = "' + $env:VERSION + '"'
              $inTarget = $false
            }
          }
          Set-Content -Path $lockPath -Value $lines

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock UPDATELOG.md
          $staged = git diff --cached --name-only
          if (-not $staged) {
            throw "version bump produced no staged changes"
          }

          $before = git rev-parse HEAD
          git commit --no-verify -m "chore(release): v$env:VERSION [skip ci]"
          $after = git rev-parse HEAD
          if ($before -eq $after) {
            throw "version bump commit was not created"
          }

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          $localHead = (git rev-parse HEAD).Trim()
          $remoteHead = ((git ls-remote origin refs/heads/main) -split '\s+')[0].Trim()
          if ($localHead -ne $remoteHead) {
            throw "main push verification failed: local=$localHead remote=$remoteHead"
          }

          $tagName = "v$env:VERSION"
          git tag $tagName
          git push origin "refs/tags/$tagName"

          $remoteTag = ((git ls-remote origin "refs/tags/$tagName") -split '\s+')[0].Trim()
          if ($remoteTag -ne $localHead) {
            throw "tag push verification failed: tag=$remoteTag head=$localHead"
          }

      - name: Build Windows service binaries from source
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/windows-service-src/Cargo.toml --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path src-tauri/local-binaries/windows-service-bin | Out-Null
          $svcOut = "src-tauri/windows-service-src/target/${{ matrix.target }}/release"
          $need = @("clash-astra-service.exe", "clash-astra-service-install.exe", "clash-astra-service-uninstall.exe", "clash-astra-firewall-helper.exe")
          foreach ($n in $need) {
            $src = Join-Path $svcOut $n
            if (-not (Test-Path $src)) { throw "missing service binary: $src" }
            Copy-Item $src (Join-Path "src-tauri/local-binaries/windows-service-bin" $n) -Force
          }

      - name: Pnpm install, sync version and check
        shell: pwsh
        run: |
          pnpm i

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $env:VERSION
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8

          pnpm sync-metadata
          pnpm check:naming
          pnpm prepare:runtime ${{ matrix.target }}

      - name: Detect signing availability
        id: sign_mode
        shell: pwsh
        run: |
          $mode = "${{ env.WINDOWS_SIGNING_MODE }}".ToLowerInvariant()
          if (-not $mode) { $mode = "unsigned" }
          $cert = "${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}"
          $pass = "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($mode -eq "pfx") {
            if (-not $cert -or -not $pass) {
              throw "WINDOWS_SIGNING_MODE=pfx but certificate/password secrets are missing"
            }
            "can_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($mode -eq "signpath") {
            if (-not "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" -or -not "${{ secrets.SIGNPATH_PROJECT_SLUG }}" -or -not "${{ secrets.SIGNPATH_API_TOKEN }}") {
              throw "WINDOWS_SIGNING_MODE=signpath but SignPath secrets are missing"
            }
            "can_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($mode -eq "ossign") {
            if (-not "${{ secrets.OSSIGN_CLIENT_ID }}" -or -not "${{ secrets.OSSIGN_CLIENT_SECRET }}") {
              throw "WINDOWS_SIGNING_MODE=ossign but OSSign secrets are missing"
            }
            "can_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "can_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "[WARN] signing disabled; release artifacts will be unsigned"
          }
          "### Windows signing mode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- mode: $mode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Tauri build
        run: pnpm tauri build --bundles none --target ${{ matrix.target }}

      - name: Build and stage Windows watchdog
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/watchdog/Cargo.toml --release --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "watchdog build failed" }
          $watchdogSource = "src-tauri/watchdog/target/${{ matrix.target }}/release/clash-astra-watchdog.exe"
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          if (-not (Test-Path -LiteralPath $watchdogSource -PathType Leaf)) { throw "missing watchdog binary: $watchdogSource" }
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          # Cargo 产物名不能带空格，发布名在这里落成用户可见名称
          Copy-Item -LiteralPath $watchdogSource -Destination (Join-Path $releaseDir "Clash Astra Watchdog.exe") -Force

      - name: Restore certificate
        if: steps.sign_mode.outputs.mode == 'pfx' && steps.sign_mode.outputs.can_sign == 'true'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("windows-signing.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}"))

      - name: Sign final release artifacts (PFX)
        if: steps.sign_mode.outputs.mode == 'pfx' && steps.sign_mode.outputs.can_sign == 'true'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $files = @(
            "src-tauri/target/${{ matrix.target }}/release/Clash Astra.exe",
            "src-tauri/target/${{ matrix.target }}/release/Clash Astra Watchdog.exe",
            "src-tauri/target/${{ matrix.target }}/release/mihomo.exe",
            "src-tauri/target/${{ matrix.target }}/release/mihomo-alpha.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "missing artifact: $f" }
          }
          foreach ($f in $files) {
            & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f "windows-signing.pfx" /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" "$f"
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $f" }
          }

      - name: Sign final release artifacts (SignPath)
        if: steps.sign_mode.outputs.mode == 'signpath' && steps.sign_mode.outputs.can_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          input-artifact-path: src-tauri/target/${{ matrix.target }}/release/Clash Astra.exe
          output-artifact-directory: src-tauri/target/${{ matrix.target }}/release

      - name: Sign Windows watchdog (SignPath)
        if: steps.sign_mode.outputs.mode == 'signpath' && steps.sign_mode.outputs.can_sign == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          input-artifact-path: src-tauri/target/${{ matrix.target }}/release/Clash Astra Watchdog.exe
          output-artifact-directory: src-tauri/target/${{ matrix.target }}/release

      - name: OSSign signing placeholder
        if: steps.sign_mode.outputs.mode == 'ossign' && steps.sign_mode.outputs.can_sign == 'true'
        shell: pwsh
        run: |
          throw "OSSign mode selected. Please wire your OSSign action/CLI command in this step per docs/release/windows-signing.md."

      - name: Verify final signatures
        if: steps.sign_mode.outputs.mode != 'unsigned' && steps.sign_mode.outputs.can_sign == 'true'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $files = @(
            "src-tauri/target/${{ matrix.target }}/release/Clash Astra.exe",
            "src-tauri/target/${{ matrix.target }}/release/Clash Astra Watchdog.exe",
            "src-tauri/target/${{ matrix.target }}/release/mihomo.exe",
            "src-tauri/target/${{ matrix.target }}/release/mihomo-alpha.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "missing artifact: $f" }
          }
          foreach ($f in $files) {
            & $signtool verify /pa /v "$f"
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed: $f" }
            Get-AuthenticodeSignature "$f" | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
          }

      - name: Portable Bundle
        shell: pwsh
        run: |
          pnpm portable ${{ matrix.target }}
        env:
          SKIP_RELEASE_UPLOAD: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNSIGNED_BUILD: ${{ steps.sign_mode.outputs.can_sign == 'true' && '0' || '1' }}

      - name: Stage and validate release assets
        shell: pwsh
        run: |
          $stage = "artifacts/staging/release"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # portable.mjs 在可签名构建（UNSIGNED_BUILD=0）时不加 _unsigned 后缀，
          # 因此这里必须按签名状态推导期望名，否则启用签名后必定找不到产物
          $unsignedSuffix = if ("${{ steps.sign_mode.outputs.can_sign }}" -eq "true") { "" } else { "_unsigned" }
          $expectedPortable = "clash-astra_${env:VERSION}_x64_portable${unsignedSuffix}.zip"
          $expectedSource = "clash-astra_${env:VERSION}_source.zip"

          $portableCandidates = Get-ChildItem . -Recurse -File -Filter "*.zip" | Where-Object { $_.Name -eq $expectedPortable }
          if ($portableCandidates.Count -ne 1) {
            $found = if ($portableCandidates) { $portableCandidates | ForEach-Object { $_.FullName } } else { @("<none>") }
            throw "portable zip must exist exactly once with name: $expectedPortable. found: $($found -join ', ')"
          }
          $portable = $portableCandidates | Select-Object -First 1
          Copy-Item $portable.FullName (Join-Path $stage $expectedPortable) -Force

          $sourcePath = Join-Path $stage $expectedSource
          git archive --format=zip --output="$sourcePath" HEAD
          if (-not (Test-Path $sourcePath)) {
            throw "source archive was not created: $sourcePath"
          }

          $actual = Get-ChildItem $stage -File | Sort-Object Name
          Write-Host "[INFO] staging files:"
          $actual | ForEach-Object { Write-Host " - $($_.Name)" }

          $expected = @($expectedPortable, $expectedSource) | Sort-Object
          if ($actual.Count -ne 2) {
            throw "staging file count must be 2, got $($actual.Count)"
          }
          $actualNames = $actual.Name
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $actualNames
          if ($diff) {
            throw "staging filenames mismatch. expected: $($expected -join ', '), actual: $($actualNames -join ', ')"
          }

      - name: Cleanup replaced and obsolete release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同时覆盖签名与未签名两种命名，切换签名状态后也能清掉上一版残留
          $assetsToDelete = @(
            "clash-astra_${env:VERSION}_x64_portable.zip",
            "clash-astra_${env:VERSION}_x64_portable_unsigned.zip",
            "clash-astra_${env:VERSION}_source.zip"
          )
          gh release view "${env:TAG_NAME}" --json id *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[INFO] release ${env:TAG_NAME} does not exist yet; skip cleanup"
            exit 0
          }

          $existingAssets = gh release view "${env:TAG_NAME}" --json assets --jq '.assets[].name'
          foreach ($assetName in $assetsToDelete) {
            if ($existingAssets -contains $assetName) {
              Write-Host "[INFO] deleting existing release asset: $assetName"
              gh release delete-asset "${env:TAG_NAME}" "$assetName" --yes
              if ($LASTEXITCODE -ne 0) {
                throw "failed to delete existing release asset: $assetName"
              }
            } else {
              Write-Host "[INFO] release asset not present, no cleanup needed: $assetName"
            }
          }

      - name: Upload Windows distribution assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          # 发布说明由 scripts/release/release-notes.mjs 按提交生成；
          # generate_release_notes 只统计已合并的 PR，本仓库直接提交到 main，用它只会得到 compare 链接
          body_path: artifacts/staging/notes.md
          # 用通配符覆盖签名与未签名两种便携包命名
          files: |
            artifacts/staging/release/clash-astra_${{ env.VERSION }}_x64_portable*.zip
            artifacts/staging/release/clash-astra_${{ env.VERSION }}_source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unsigned build notice
        if: steps.sign_mode.outputs.can_sign != 'true'
        shell: pwsh
        run: |
          "### Windows signing status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "This Windows build is unsigned." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Windows may show Unknown Publisher / SmartScreen warning." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "This is expected for unsigned builds." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Cleanup cert file
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "windows-signing.pfx") { Remove-Item "windows-signing.pfx" -Force }
