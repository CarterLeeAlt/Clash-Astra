port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geodata-loader: standard
geo-update-interval: 24
geox-url:
  geoip: >-
    https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/release/geoip.dat
  geosite: >-
    https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/release/geosite.dat
  mmdb: >-
    https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/release/country.mmdb
  asn: >-
    https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/release/GeoLite2-ASN.mmdb
rule-providers:
  geolocation-cn:
    type: http
    format: mrs
    behavior: domain
    url: >-
      https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/geolocation-cn.mrs
    path: ./ruleset/geolocation-cn.mrs
    interval: 86400
  cn:
    type: http
    format: mrs
    behavior: domain
    url: >-
      https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs
    path: ./ruleset/cn.mrs
    interval: 86400
  geolocation-!cn:
    type: http
    format: mrs
    behavior: domain
    url: >-
      https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/geolocation-!cn.mrs
    path: ./ruleset/geolocation-!cn.mrs
    interval: 86400
  private-ip:
    type: http
    format: mrs
    behavior: ipcidr
    url: >-
      https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/private.mrs
    path: ./ruleset/private-ip.mrs
    interval: 86400
  cn-ip:
    type: http
    format: mrs
    behavior: ipcidr
    url: >-
      https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cn.mrs
    path: ./ruleset/cn-ip.mrs
    interval: 86400
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  fake-ip-filter:
    - localhost
    - localhost.*
    - +.lan
    - +.local
    - +.home.arpa
    - +.in-addr.arpa
    - +.ip6.arpa
    - +.msftconnecttest.com
    - +.msftncsi.com
    - captive.apple.com
    - time.*.apple.com
    - time-ios.apple.com
    - time1.cloud.tencent.com
    - ntp.aliyun.com
  nameserver:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    geosite:geolocation-!cn:
      - https://1.1.1.1/dns-query
      - https://1.0.0.1/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver-follow-policy: true
proxies:
  - server: example.invalid
    port: 443
    name: SS
    type: ss
    cipher: aes-128-gcm
    password: synthetic
    udp: true
  - server: example.invalid
    port: 443
    name: VMess
    type: vmess
    uuid: 00000000-0000-0000-0000-000000000001
    alterId: 0
    cipher: auto
    tls: true
    alpn:
      - h2
    client-fingerprint: firefox
    network: ws
    ws-opts:
      path: /test
      headers:
        Host: example.invalid
  - server: example.invalid
    port: 443
    name: VLESS
    type: vless
    uuid: 00000000-0000-0000-0000-000000000001
    tls: true
    network: http
    http-opts:
      path:
        - /test
      headers:
        Host:
          - example.invalid
    alpn:
      - h2
    tfo: true
  - server: example.invalid
    port: 443
    name: VLESS-XHTTP
    type: vless
    uuid: 00000000-0000-0000-0000-000000000001
    tls: true
    network: xhttp
    xhttp-opts:
      path: /test
      mode: auto
      host: example.invalid
  - server: example.invalid
    port: 443
    name: Trojan
    type: trojan
    password: synthetic
    alpn:
      - h2
    client-fingerprint: chrome
    network: grpc
    grpc-opts:
      grpc-service-name: test
  - server: example.invalid
    port: 443
    name: HY1
    type: hysteria
    auth-str: synthetic
    up: 10 Mbps
    down: 20 Mbps
    alpn:
      - hysteria
  - server: example.invalid
    port: 443
    name: HY2
    type: hysteria2
    password: synthetic
    ports: 443,8443
    hop-interval: 15-30
    alpn:
      - h3
    bbr-profile: conservative
    handshake-timeout: 10
  - server: example.invalid
    port: 443
    name: TUIC
    type: tuic
    uuid: 00000000-0000-0000-0000-000000000001
    password: synthetic
    congestion-controller: bbr
    alpn:
      - h3
  - server: example.invalid
    port: 443
    name: AnyTLS
    type: anytls
    password: synthetic
    idle-session-timeout: 30
    sni: example.invalid
proxy-groups:
  - type: select
    name: 🚀 节点选择
    proxies:
      - ⚡ 自动选择
      - SS
      - VMess
      - VLESS
      - VLESS-XHTTP
      - Trojan
      - HY1
      - HY2
      - TUIC
      - AnyTLS
      - DIRECT
      - REJECT
  - name: ⚡ 自动选择
    type: url-test
    proxies:
      - SS
      - VMess
      - VLESS
      - VLESS-XHTTP
      - Trojan
      - HY1
      - HY2
      - TUIC
      - AnyTLS
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
  - type: select
    name: 🔐 私有网络
    proxies:
      - DIRECT
      - 🚀 节点选择
      - SS
      - VMess
      - VLESS
      - VLESS-XHTTP
      - Trojan
      - HY1
      - HY2
      - TUIC
      - AnyTLS
      - REJECT
  - type: select
    name: 🏠 国内服务
    proxies:
      - DIRECT
      - 🚀 节点选择
      - SS
      - VMess
      - VLESS
      - VLESS-XHTTP
      - Trojan
      - HY1
      - HY2
      - TUIC
      - AnyTLS
      - REJECT
  - type: select
    name: 🌍 非中国
    proxies:
      - 🚀 节点选择
      - SS
      - VMess
      - VLESS
      - VLESS-XHTTP
      - Trojan
      - HY1
      - HY2
      - TUIC
      - AnyTLS
      - DIRECT
      - REJECT
  - type: select
    name: 🐟 漏网之鱼
    proxies:
      - 🚀 节点选择
      - SS
      - VMess
      - VLESS
      - VLESS-XHTTP
      - Trojan
      - HY1
      - HY2
      - TUIC
      - AnyTLS
      - DIRECT
      - REJECT
x-sublink-contract: mihomo-v1.19.33-common
x-mihomo-version: v1.19.33
rules:
  - RULE-SET,geolocation-cn,🏠 国内服务
  - RULE-SET,cn,🏠 国内服务
  - RULE-SET,geolocation-!cn,🌍 非中国
  - RULE-SET,private-ip,🔐 私有网络,no-resolve
  - RULE-SET,cn-ip,🏠 国内服务,no-resolve
  - MATCH,🐟 漏网之鱼
