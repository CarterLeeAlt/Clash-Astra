[package]
name = "clash-astra-service-src"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "clash-astra-service"
path = "src/bin/clash-astra-service.rs"

[[bin]]
name = "clash-astra-service-install"
path = "src/bin/clash-astra-service-install.rs"

[[bin]]
name = "clash-astra-service-uninstall"
path = "src/bin/clash-astra-service-uninstall.rs"

[[bin]]
name = "clash-astra-firewall-helper"
path = "src/bin/clash-astra-firewall-helper.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
once_cell = "1"
windows-service = "0.6"
rand = "0.8"
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
] }
