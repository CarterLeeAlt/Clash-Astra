[package]
name = "clash-astra"
version = "1.8.1"
description = "Clash Astra"
authors = ["Clash Astra"]
license = "GPL-3.0-only"
repository = "https://github.com/CarterLeeAlt/Clash-Astra.git"
default-run = "clash-astra"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
warp = "0.3"
anyhow = "1.0"
open = "5.0"
log = "0.4"
dunce = "1.0"
log4rs = "1"
nanoid = "0.4"
chrono = "0.4"
sysinfo = "0.30"
rquickjs = "0.3"
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.18"
regex = "1"
port_scanner = "0.1.5"
delay_timer = "0.11.5"
parking_lot = "0.12"
percent-encoding = "2.3.1"
window-shadows = { version = "0.2" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rustls = "0.21"
sysproxy = { path = "vendor-crates/sysproxy-rs" }
auto-launch = { path = "vendor-crates/auto-launch" }
tauri = { version = "1.5", features = [ "path-all", "protocol-asset", "dialog-open", "icon-png", "clipboard-all", "global-shortcut-all", "process-all", "shell-all", "system-tray" , "window-all"] }

[target.'cfg(windows)'.dependencies]
runas = "=1.0.0" # 高版本会返回错误 Status
deelevate = "0.2.0"
winreg = "0.52.0"
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
# 与 tauri 1.5 / wry 0.24 使用的版本一致，用于注册 WebView2 ProcessFailed 事件
webview2-com = "0.19.1"
windows = { version = "0.39.0", features = ["Win32_System_WinRT"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
verge-dev = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
